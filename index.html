<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Project Web Condo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: drafting-table viewer. Left index of sheets (like a drawing register), right canvas with the sheet; floating zoom control. Collapses to a top bar + page picker on phones. */
:root{
  --bg:#eceff3; --panel:#ffffff; --panel-2:#f6f8fa; --line:#d6dce3; --fg:#18212c; --muted:#5d6977;
  --accent:#1d5bb8; --accent-soft:#e4edfb; --accent-fg:#ffffff;
  --grid:rgba(29,91,184,.07); --shadow:0 1px 2px rgba(20,35,60,.10),0 10px 30px rgba(20,35,60,.10);
  --f-ui:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171e; --panel:#19212b; --panel-2:#1e2733; --line:#2b3644; --fg:#e5eaf1; --muted:#98a4b4;
  --accent:#7fb0ff; --accent-soft:#223450; --accent-fg:#0d1622;
  --grid:rgba(127,176,255,.06); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171e; --panel:#19212b; --panel-2:#1e2733; --line:#2b3644; --fg:#e5eaf1; --muted:#98a4b4;
  --accent:#7fb0ff; --accent-soft:#223450; --accent-fg:#0d1622;
  --grid:rgba(127,176,255,.06); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* sidebar */
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  padding-left:env(safe-area-inset-left,0px)}
.brand{padding:22px 20px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.brand h1{margin:0;font-size:20px;font-weight:700;line-height:1.25;text-wrap:balance}
.brand p{margin:0;font-size:14px;color:var(--muted)}
.list-label{font-size:12px;color:var(--muted);padding:16px 20px 8px;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
ol{list-style:none;margin:0;padding:0 10px 16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:2px}
.item{width:100%;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;text-align:left;
  background:transparent;border:0;border-radius:8px;padding:10px 10px;color:var(--fg);line-height:1.4;font-size:14px}
.item .n{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;
  height:24px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:-1px}
.item:hover{background:var(--panel-2)}
.item[aria-current="true"]{background:var(--accent-soft);font-weight:600}
.item[aria-current="true"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.help{border-top:1px solid var(--line);padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);display:grid;gap:4px}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel-2);color:var(--fg)}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;
  padding-block:12px;padding-left:24px;padding-right:max(16px,env(safe-area-inset-right,0px));min-height:64px}
.bar .count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar h2{margin:0;font-size:18px;font-weight:600;line-height:1.3;min-width:0;text-wrap:balance;flex:1}
.nav{display:flex;gap:6px;flex:none}
.btn{height:36px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.btn:hover:not(:disabled){background:var(--panel-2);border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.picker{display:none}

#view{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
#view.dragging{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#sheet{background:#fff;box-shadow:var(--shadow);border-radius:3px;line-height:0}
#sheet svg{display:block}
.zoom{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;gap:2px}
.zoom button{height:32px;min-width:32px;border:0;background:transparent;border-radius:7px;font-size:16px;padding:0 8px}
.zoom button:hover{background:var(--panel-2)}
.zoom .fit{font-size:13px}
#zoomLabel{font-family:var(--f-mono);font-size:12px;min-width:48px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.sep{width:1px;height:20px;background:var(--line);margin:0 2px}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  .bar{flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));gap:10px}
  .bar h2{display:none}
  .bar .count{display:none}
  .picker{display:block;flex:1;min-width:0;position:relative}
  .picker select{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font:inherit;font-size:14px;padding:0 34px 0 12px;appearance:none;text-overflow:ellipsis}
  .picker::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
  .btn .lbl{display:none}
  .zoom .fit,.zoom .sep{display:none}
}
@media (prefers-reduced-motion:no-preference){#stage.anim{transition:transform .18s ease-out}}
</style>

<div class="app">
  <aside>
    <div class="brand">
      <h1>Software engineer Project Section 2 Group 1</h1>
    </div>
    <div class="list-label"><span>ไดอะแกรม</span><span id="total"></span></div>
    <ol id="list"></ol>
    <div class="help">
      <span>ลากเพื่อเลื่อน · scroll เพื่อซูม</span>
      <span><kbd>←</kbd> <kbd>→</kbd> เปลี่ยนหน้า · <kbd>0</kbd> พอดีจอ</span>
    </div>
  </aside>
  <div class="main">
    <div class="bar">
      <span class="count" id="count"></span>
      <h2 id="pageTitle"></h2>
      <label class="picker"><span hidden>เลือกไดอะแกรม</span><select id="pick" aria-label="เลือกไดอะแกรม"></select></label>
      <div class="nav">
        <button class="btn" id="prev" aria-label="หน้าก่อนหน้า"><span aria-hidden="true">←</span><span class="lbl">ก่อนหน้า</span></button>
        <button class="btn" id="next" aria-label="หน้าถัดไป"><span class="lbl">ถัดไป</span><span aria-hidden="true">→</span></button>
      </div>
    </div>
    <div id="view" aria-label="พื้นที่ไดอะแกรม">
      <div id="stage"><div id="sheet"></div></div>
      <div class="zoom">
        <button id="zout" aria-label="ซูมออก">−</button>
        <span id="zoomLabel">100%</span>
        <button id="zin" aria-label="ซูมเข้า">+</button>
        <span class="sep"></span>
        <button class="fit" id="fit">พอดีจอ</button>
      </div>
    </div>
  </div>
</div>

<script>
const PAGES=JSON.parse(document.getElementById('pages').textContent);
const $=id=>document.getElementById(id);
const view=$('view'),stage=$('stage'),sheet=$('sheet'),list=$('list'),pick=$('pick'),zl=$('zoomLabel');
let cur=-1,s=1,tx=0,ty=0,W=0,H=0;
const num=i=>String(i+1).padStart(2,'0');
$('total').textContent=PAGES.length+' หน้า';
PAGES.forEach((p,i)=>{
  const li=document.createElement('li'),b=document.createElement('button');b.className='item';b.id='it'+i;
  b.innerHTML='<span class="n"></span><span class="t"></span>';b.querySelector('.n').textContent=num(i);b.querySelector('.t').textContent=p.name;
  b.onclick=()=>{location.hash='p'+(i+1)};li.appendChild(b);list.appendChild(li);
  const o=document.createElement('option');o.value=i;o.textContent=num(i)+'  '+p.name;pick.appendChild(o)});
pick.onchange=()=>{location.hash='p'+(+pick.value+1)};
function apply(){stage.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;zl.textContent=Math.round(s*100)+'%'}
function fit(){const r=view.getBoundingClientRect(),pad=r.width<600?16:40;s=Math.min((r.width-pad*2)/W,(r.height-pad*2-56)/H,2);
  tx=(r.width-W*s)/2;ty=Math.max(pad,(r.height-56-H*s)/2);apply()}
function zoomAt(f,cx,cy){const ns=Math.min(8,Math.max(.05,s*f));tx=cx-(cx-tx)*ns/s;ty=cy-(cy-ty)*ns/s;s=ns;apply()}
function smooth(fn){stage.classList.add('anim');fn();setTimeout(()=>stage.classList.remove('anim'),200)}
function show(i){i=Math.max(0,Math.min(PAGES.length-1,i));if(i===cur)return;cur=i;const p=PAGES[i];
  sheet.innerHTML=p.svg;const svg=sheet.querySelector('svg');
  const vb=(svg.getAttribute('viewBox')||'').split(/[\s,]+/).map(Number);
  W=vb.length===4&&vb[2]?vb[2]:parseFloat(svg.getAttribute('width'));H=vb.length===4&&vb[3]?vb[3]:parseFloat(svg.getAttribute('height'));
  svg.setAttribute('width',W);svg.setAttribute('height',H);svg.style.maxWidth='none';sheet.style.width=W+'px';sheet.style.height=H+'px';
  document.querySelectorAll('.item').forEach((t,j)=>t.setAttribute('aria-current',j===i));
  $('it'+i).scrollIntoView({block:'nearest'});pick.value=i;
  $('pageTitle').textContent=p.name;$('count').textContent=num(i)+' / '+num(PAGES.length-1);
  $('prev').disabled=i===0;$('next').disabled=i===PAGES.length-1;fit()}
function route(){const m=/^#p(\d+)$/.exec(location.hash);show(m?+m[1]-1:0)}
window.addEventListener('hashchange',route);
$('prev').onclick=()=>{if(cur>0)location.hash='p'+cur};
$('next').onclick=()=>{if(cur<PAGES.length-1)location.hash='p'+(cur+2)};
const ctr=()=>{const r=view.getBoundingClientRect();return[r.width/2,r.height/2]};
$('zin').onclick=()=>smooth(()=>zoomAt(1.25,...ctr()));
$('zout').onclick=()=>smooth(()=>zoomAt(1/1.25,...ctr()));
$('fit').onclick=()=>smooth(fit);
view.addEventListener('wheel',e=>{e.preventDefault();const r=view.getBoundingClientRect();
  if(e.ctrlKey||(!e.shiftKey&&Math.abs(e.deltaX)<1))zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015)),e.clientX-r.left,e.clientY-r.top);
  else{tx-=e.deltaX;ty-=e.deltaY;apply()}},{passive:false});
view.addEventListener('dblclick',e=>{if(!e.target.closest('.zoom'))smooth(fit)});
const pts=new Map();let last=null;
view.addEventListener('pointerdown',e=>{if(e.target.closest('.zoom'))return;view.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);view.classList.add('dragging');last=null});
view.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===1){tx+=e.clientX-prev[0];ty+=e.clientY-prev[1];apply()}
  else if(pts.size===2){const[a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const r=view.getBoundingClientRect();
    const cx=(a[0]+b[0])/2-r.left,cy=(a[1]+b[1])/2-r.top;if(last){zoomAt(d/last.d,cx,cy);tx+=cx-last.cx;ty+=cy-last.cy;apply()}last={d,cx,cy}}});
const end=e=>{pts.delete(e.pointerId);last=null;if(!pts.size)view.classList.remove('dragging')};
view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;
  if(e.key==='ArrowRight')$('next').click();else if(e.key==='ArrowLeft')$('prev').click();
  else if(e.key==='+'||e.key==='=')smooth(()=>zoomAt(1.25,...ctr()));else if(e.key==='-')smooth(()=>zoomAt(1/1.25,...ctr()));else if(e.key==='0')smooth(fit)});
window.addEventListener('resize',fit);
route();
</script>
